# bench-management — Bench-Management Pod (resource & staffing)
#
# A POD, not a pipeline. A coordinator owns each staffing case end to end; a
# team of specialists reads the bench, screens candidates (parallel fan-out),
# plans the allocation, and develops idle talent; a FINISHER books the approved
# assignment and produces the real artifact; named humans decide every gate; the
# Manager is the SUPERVISOR that escalates repeated errors; a hash-chained WORM
# sink is the terminus of every path.
#
# THE FLOW (one human · one agent · one system per stage):
#   coordinator opens the case -> workforce_analytics serves the forecast
#   (bench %, below-floor, skills) -> candidate_screening fans out over the
#   bench (scaling.copies + atomic claim) and shortlists -> staffing_coordinator
#   (super-agent) plans the allocation and DERIVES the routing floors ->
#   a named human approves -> allocation_booker (the finisher) re-checks the
#   approval, refuses to double-book, RENDERS the booking artifact to ./out,
#   deletes it on a blocked floor -> WORM audit terminus. Talent development,
#   performance review and ESAT are sibling specialists on their own entries.
#
# Every wire is CONDITIONAL on the producer's declared output; nothing is booked
# on silence (an unanswered card closes and the ticket records that no reply
# came); the systems of record (PSA / HRIS / BI) are TOOLS inside agents, never
# members.
#
# Design doctrine: ../claude_skills/leafmesh/building-agents-thoroughly.md
# Nuances (2.4.131): ../claude_skills/leafmesh/nuances-and-gotchas.md

name: "bench-management"
version: "2.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# 2.4.131 runtime block — raise the LLM hard timeout: the super-agent allocation
# planner and the fanned-out screening can run long. (The `timeouts` block is
# rejected by <=2.4.130, so it ships WITH the 2.4.131 floor, never before.)
timeouts:
  mesh_call_default_timeout_s: 120
  llm_hard_timeout_s: 300

# The Manager is the SUPERVISOR. It escalates to the Practice Lead only on
# errors: a non-retryable error (auth / bad request / bad config) the first time
# it happens, 3 failed agents in one session (max_errors_per_session), or
# restarts used up. Contract violations (yields not met) alert people; they do
# not escalate. An unanswered question is not escalated: the card closes and the
# ticket records it. Bench %, idle and structural-gap alerts reach the Practice
# Lead through the agents' own can_call wires. It is NOT a router in the middle
# of the team (routing is the can_call wires below).
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true
  prompt: |
    This mesh runs bench management for a professional-services firm as a TEAM.
    A staffing case flows: the bench coordinator opens it -> workforce_analytics
    serves the forecast (bench %, below-floor, skills) -> candidate_screening
    shortlists the bench -> staffing_coordinator plans the allocation and derives
    the routing floors -> a named human approves -> the allocation booker books
    the assignment and records it. Talent development, performance review and
    ESAT are sibling specialists.

    Bench % over the ceiling, 4-week idle staff and structural skills gaps
    already reach the Practice Lead through the agents' own routes. You step in
    on errors: an agent that keeps failing goes to the Practice Lead. Silence
    never advances a staffing decision.
  routing:
    mode: "static"
  escalation:
    targets:
      - type: "human_agent"
        agent: "practice_lead_human"
      # Webhook escalation (e.g. PagerDuty): create the vault connection
      # 'escalation_webhook' (an "Add custom" record on the Infrastructure
      # page, service type 'Outbound webhook'), then uncomment — here before the
      # first start, in Studio's YAML editor after it (applies live).
      # - type: "webhook"
        # connection: escalation_webhook   # vault connection holds the URL + headers
        # method: "POST"
        # payload_template:
          # incident_id: "{{plan_id}}"
          # severity: "{{severity}}"
          # message: "{{message}}"
          # session_id: "{{session_id}}"
    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
  health_check_interval: 60
  agent_timeout_threshold: 300
  chain_completion_timeout: 600

data_structures:
  AllocationPlan:
    type: "object"
    properties:
      plan_id: { type: "string" }
      cycle: { type: "string" }
      received_at_utc: { type: "string" }
    required: ["plan_id"]

# ── Entry points — one per real-world trigger. Multiple doors: case triggers
#    open through the coordinator; programmatic ingest / mode calls address the
#    analytics agent directly; talent / review / survey have their own doors. ──
entry_points:
  - name: "new_project_kickoff"
    target: "bench_coordinator_agent"
    description: "A new engagement needs staffing — the coordinator opens the case."
    condition: always

  - name: "case_status"
    target: "bench_coordinator_agent"
    description: "Anyone asks 'where is this staffing case?' — the coordinator answers from the record."
    condition: always

  - name: "manual_action"
    target: "bench_coordinator_agent"
    description: "RM-initiated ad-hoc case."
    condition: always

  - name: "weekly_bench_review"
    target: "workforce_analytics_agent"
    description: "Weekly Monday bench-review sweep (also fires via wake_up cron)."
    condition: always

  - name: "weekly_bench_report"
    target: "weekly_bench_sweep_agent"
    description: "Build the weekly bench report (also fires Monday 08:00 via wake_up cron, before the 09:00 review)."
    condition: always

  - name: "person_rolling_off"
    target: "talent_development_agent"
    description: "Person ends an engagement → flag for next allocation + development."
    condition: always

  - name: "utilisation_ingest"
    target: "workforce_analytics_agent"
    description: "Record one week's utilisation for one consultant (mode=ingest)."
    condition: always

  - name: "utilisation_report"
    target: "workforce_analytics_agent"
    description: "Sweep utilisation across the bench (mode=report)."
    condition: always

  - name: "skill_upsert"
    target: "workforce_analytics_agent"
    description: "Insert / update one skill record for one consultant (mode=upsert)."
    condition: always

  - name: "skills_search"
    target: "workforce_analytics_agent"
    description: "Search the inventory for skills needed on an engagement (mode=search)."
    condition: always

  - name: "career_path_request"
    target: "talent_development_agent"
    description: "For 4+ week idle staff — draft a 6-month career path."
    condition: always

  - name: "promotion_readiness"
    target: "talent_development_agent"
    description: "Engineer flagged promotable — assemble readiness assessment + gaps."
    condition: always

  - name: "draft_performance_review"
    target: "performance_review_agent"
    description: "Q/annual review draft — engagement feedback + util + skill growth → composite + rating."
    condition: always

  - name: "launch_esat_pulse"
    target: "esat_survey_agent"
    description: "Launch an anonymised ESAT pulse survey (mode=pulse)."
    condition: always

  - name: "analyse_esat_survey"
    target: "esat_survey_agent"
    description: "Analyse a closed survey — engagement index + themes + HRBP flags (mode=analyse)."
    condition: always

  # ── Direct-call / HITL-resume doors ──
  - name: "direct_call_candidate_screening"
    target: "candidate_screening_agent"
    description: "On-demand fan-out screening of the current bench (bypasses upstream chain)."
    condition: always

  - name: "direct_call_staffing_coordinator"
    target: "staffing_coordinator_agent"
    description: "On-demand allocation planning over an existing shortlist (bypasses upstream chain)."
    condition: always

  - name: "staffing_decision"
    target: "staffing_partner_human"
    description: "HITL resume — a staffing partner approves / holds a plan in their inbox."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # bench_coordinator_agent — Bench Coordinator (AI). Owns each staffing case
  # end to end: opens it, orchestrates the pod, keeps live status, is the RM's
  # single point of contact. Pure orchestration — never reads the PSA, never
  # matches, never books. (Pure YAML — routing is the wires below.)
  # ─────────────────────────────────────────────────────────────────────────
  bench_coordinator_agent:
    name: "bench_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    description: "Bench Coordinator — opens the staffing case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are the Bench Coordinator. You OWN each staffing case from the moment
      an engagement needs people to the moment the assignment is booked. You
      orchestrate the pod and keep the requester informed — you never read the
      PSA, match people, or book an assignment yourself.

      On a new kickoff: open the case, record the cycle, and hand it to workforce
      analytics for the forecast (action = "open_case"). On a status ask: answer
      the current stage / waiting-on from the case record — nothing invented
      (action = "status"). On a talent trigger (someone rolling off, a career
      path): hand to talent development (action = "talent"). Route any exception
      you cannot resolve to the Practice Lead (action = "escalate"); never make
      the bench / policy call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "plan_id": "", "stage": "", "waiting_on": "", "summary": ""}
    yields:
      action: "string"        # open_case | status | talent | escalate
      plan_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    can_call:
      - agent: "workforce_analytics_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "talent_development_agent"
        condition: "calling_agent_response.action == 'talent'"
      - agent: "practice_lead_human"
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # workforce_analytics_agent — Workforce Analyst (SYSTEM, connector-backed +
  # deterministic floors). One analytics ROLE, mode-dispatched (forecast |
  # ingest | report | upsert | search), served from your PSA/HRIS via n8n. The
  # bench-ceiling and below-floor VALUES are computed in code (the floor) so the
  # can_call wires cannot be silenced by a soft workflow or a prompt.
  # agency/workforce_analytics_agent.py serves the store day-0 / shapes the
  # connector response when wired. The n8n lines ship commented: an n8n
  # integration with no workflow address fails every call, and five failures
  # in a row quarantine the agent, so its day-0 Python would stop running.
  # ─────────────────────────────────────────────────────────────────────────
  workforce_analytics_agent:
    name: "workforce_analytics_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Workforce analyst — capacity forecast, utilisation ledger and skills inventory from your PSA/HRIS (deterministic bench/below-floor floor)."
    # n8n workflow → your PSA / HRIS. Day 0 it is unwired (the Python serves
    # the store). To wire it: create the vault connection 'psa_n8n' (on
    # Infrastructure → Integrations → n8n: base URL = the workflow's webhook
    # URL, token = its auth token), then uncomment the two lines below (here
    # before the first start, in Studio's YAML editor after it). A webhook URL
    # or token written here is refused at load.
    # integration: "n8n"
    # connector_config: {connection: psa_n8n, timeout: 60}
    # Weekly Monday bench-review sweep, in the firm's timezone (NOT UTC — a bare
    # cron pins to UTC). Also reachable via the weekly_bench_review entry point.
    # Set `timezone` to your business timezone.
    wake_up: "0 9 * * 1"
    timezone: "Asia/Kolkata"
    wake_up_input:
      mode: forecast
    yields:
      mode: "string"
      # capacity forecast
      utilisation_30d_pct: "number"
      utilisation_60d_pct: "number"
      utilisation_90d_pct: "number"
      bench_pct_current: "number"
      open_opportunities: "list"
      available_consultants: "list"
      # utilisation ledger
      consultants_tracked: "number"
      horizon_weeks: "number"
      overall_utilisation: "number"
      below_floor_consultants: "list"
      utilisation_briefing: "string"
      # skills inventory
      total_skill_records: "number"
      distinct_skills: "number"
      min_level: "string"
      matches_per_skill: "object"
      coverage_pct: "number"
      gaps: "list"
      skills_inventory_briefing: "string"
    inputs:
      payload: "object"
      mode: "string"
      consultant_id: "string"
      week_ending: "string"
      billable_hours: "number"
      non_billable_hours: "number"
      idle_hours: "number"
      available_hours: "number"
      horizon_weeks: "number"
      skill: "string"
      level: "string"
      last_used: "string"
      verified_by: "string"
      endorsements: "number"
      needed_skills: "list"
      min_level: "string"
    can_call:
      # Forecast runs continue into candidate screening; ledger / inventory CRUD
      # modes are terminal.
      - agent: "candidate_screening_agent"
        condition: "calling_agent_response.mode == 'forecast'"
      # BENCH-CEILING ALERT — bench above the 15% target ceiling → practice lead.
      - agent: "practice_lead_human"
        condition: "calling_agent_response.bench_pct_current > 0.15"
      # BELOW-FLOOR UTILISATION — any consultant under the billable floor for 3+
      # weeks → staffing partner (RM action).
      - agent: "staffing_partner_human"
        condition: "calling_agent_response.below_floor_consultants != []"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # candidate_screening_agent — Candidate-Screening Analyst (AI, PARALLEL
  # COPIES). Fans out over the benched roster: each of N copies atomically
  # CLAIMS a disjoint batch of consultants (claim_screening_batch) and scores
  # them against the open opportunities, so a large bench is screened in
  # parallel with no double-work. Deliberately SEPARATE from the allocation
  # planner (screening is not planning — a second role, a second pass). Yields
  # are list/sum-safe so `scaling.copies.handoff: last` merges cleanly.
  # agency/candidate_screening_agent.py: @pre_compose seeds the claim queue +
  # supplies the demand; @chain normalises the merged shortlist.
  # ─────────────────────────────────────────────────────────────────────────
  candidate_screening_agent:
    name: "candidate_screening_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tool_calls_per_message: 15   # claim + score chain; default 5 truncates silently
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 2                     # 2 parallel copies per activation (2.4.118+)
        handoff: last          # COMBINE the copies' shortlists, route once
    description: "Candidate-screening analyst — fans out over the bench, claims disjoint batches, shortlists candidates against open opportunities."
    prompt: |
      You are a Candidate-Screening Analyst, one of several copies running in
      parallel over the same bench. context["prepared_data"] carries the demand
      you score against, already pulled for you:
        - "open_opportunities": engagements needing staffing + required skills
        - "backlog_size": how many benched consultants remain to be screened

      FIRST call claim_screening_batch to atomically claim YOUR disjoint batch of
      benched consultants — never screen a consultant another copy already
      claimed. If the tool returns available:false, the backlog is drained: return
      empty lists and say so. Score ONLY the consultants in your claimed batch
      against the real open_opportunities — do not invent people or roles.

      For each good fit, emit a shortlist row {consultant_id, opportunity_id,
      fit_score (0..1), rationale}. Put the consultant_id of everyone you claimed
      in "claimed_consultants", and the consultant_id of each one you could not
      place in "unmatched". Keep "screening_briefing" to one line: how many you
      screened and the strongest fit.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"shortlist": [], "claimed_consultants": [], "screened_count": 0, "unmatched": [], "screening_briefing": ""}
    enforce_yields: true
    enforce_yields_retry: 1
    yields:
      shortlist:
        type: array
        items:
          type: object
          fields:
            consultant_id: string
            opportunity_id: string
            fit_score: number
            rationale: string
      claimed_consultants: { type: array, items: string }   # consultant_ids
      screened_count: "number"
      unmatched: { type: array, items: string }             # consultant_ids
      screening_briefing: "string"
    inputs:
      upstream_yields: "object"
      open_opportunities: "list"
    # Day-0 tool surface — the atomic claim tool + bench reads from the seed
    # store, so the fan-out runs with NO connector wired. Each tool announces
    # itself (available:false) when it has no real source. See agency/tools.py.
    tools: [claim_screening_batch, read_open_opportunities, read_bench_roster]
    tool_categories: [screening, bench]
    # ── To wire a real PSA/HRIS as MCP tools: create the vault connection
    #    'psa_mcp' (the MCP server's URL + token) on Infrastructure →
    #    Integrations → MCP, then uncomment — here before the first start, in
    #    Studio's YAML editor after it (each named action under `use:` becomes
    #    its own namespaced tool, e.g. psa_list_bench). A URL or token written
    #    here is refused at load. ──
    # mcp:
    #   - connection: psa_mcp
    #     transport: http
    #     use: [list_bench, list_opportunities, read_skills]
    #     name: psa
    #     timeout: 30
    can_call:
      # A non-empty shortlist proceeds to allocation planning; an empty screen
      # (backlog drained / nobody fits) is terminal.
      - agent: "staffing_coordinator_agent"
        condition: "calling_agent_response.shortlist != []"

  # ─────────────────────────────────────────────────────────────────────────
  # staffing_coordinator_agent — Staffing Coordinator (AI, SUPER-AGENT). One
  # staffing ROLE: turn the shortlist into an assignment plan. super_agent gives
  # it autonomous plan/execute/verify across many people × opportunities.
  # agency/staffing_coordinator_agent.py: @pre_compose pulls supply + demand;
  # @chain re-derives double-booking + structural-gap and FORCES the routing
  # flags so the can_call gates can't be softened by a hallucinated flag.
  # ─────────────────────────────────────────────────────────────────────────
  staffing_coordinator_agent:
    name: "staffing_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    max_tool_calls_per_message: 15   # super-agent planner tools chain; raise off the default 5
    super_agent:                     # DICT form = the tuning path (2.4.123+)
      cost_ceiling: 100000
      wall_clock: 900
    description: "Staffing coordinator — turns the shortlist into an assignment plan with conflict + structural-gap detection."
    prompt: |
      You are the Staffing Coordinator. context["prepared_data"] carries the
      supply/demand already pulled for you (pre_compose):
        - "available_consultants": the benched people + their skills
        - "open_opportunities": engagements needing staffing + required skills
        - "shortlist": the screening shortlist from upstream (if any)
      Plan against THIS real supply/demand — do not invent people or roles. Load
      the `allocation` playbook for the exact match → plan → conflict order.

      Produce:
        - "matches": [{person_id, opportunity_id, fit_score, top_reason}]
        - "unmatched_people" (consultant_ids) / "unmatched_opportunities"
          (opportunity_ids)
        - "skills_gaps": [{skill, demand, supply}] where demand > supply
        - "staffing_briefing": 3-sentence narrative — match count + average fit,
          the single biggest gap (or "no gaps identified"), a recommendation.
          NEVER leave it empty.
        - "plan_id": "plan-" + 10 lowercase hex chars.
        - "assignments": copy "matches" verbatim.
        - "conflicts", "requires_engagement_lead_review",
          "requires_practice_lead_review": set as best you can — but the
          POST-PROCESSOR re-derives these deterministically from your matches +
          the live opportunities, and the code is the authority on routing.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"matches": [], "unmatched_people": [], "unmatched_opportunities": [], "skills_gaps": [], "staffing_briefing": "", "plan_id": "", "assignments": [], "conflicts": [], "requires_engagement_lead_review": false, "requires_practice_lead_review": false}
    enforce_yields: true
    enforce_yields_retry: 2
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` loads when the model recognises the intent.
    playbook:
      - intent: allocation
        description: "How to match the shortlist to opportunities and build a conflict-free plan."
        responsibility: |
          1. Match available people to open opportunities on skill fit FIRST —
             one person to the single best opportunity, highest fit; do not
             spread one person across many just to fill seats.
          2. Prefer ONE person per opportunity. Any person_id appearing in 2+
             matches is a double-booking → it belongs in "conflicts".
          3. A single skill in "skills_gaps" that blocks TWO OR MORE open
             opportunities is a STRUCTURAL gap (hire / partner / decline — a
             practice-level call), not a staffing assignment.
          4. Generate plan_id as "plan-" + 10 lowercase hex chars. Copy matches
             into assignments verbatim; the booker books only what a human approved.
        variables: [plan_id]
    yields:
      matches:
        type: array
        items:
          type: object
          fields: { person_id: string, opportunity_id: string, fit_score: number, top_reason: string }
      unmatched_people: { type: array, items: string }          # consultant_ids
      unmatched_opportunities: { type: array, items: string }   # opportunity_ids
      skills_gaps:
        type: array
        items:
          type: object
          fields: { skill: string, demand: number, supply: number }
      staffing_briefing: "string"
      plan_id: "string"
      assignments:
        type: array
        items:
          type: object
          fields: { person_id: string, opportunity_id: string, fit_score: number, top_reason: string }
      conflicts: { type: array, items: { type: object } }       # re-derived in code: {person_id, count}
      requires_engagement_lead_review: "boolean"
      requires_practice_lead_review: "boolean"
    inputs:
      upstream_yields: "object"
      matches: "list"
      shortlist: "list"
    can_call:
      # Structural skills gap (one skill blocking 2+ opportunities) is a
      # practice-level decision — wins over the staffing routes below.
      - agent: "practice_lead_human"
        condition: "calling_agent_response.requires_practice_lead_review == true"
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_practice_lead_review == false and (calling_agent_response.requires_engagement_lead_review == true or calling_agent_response.conflicts != [])"
      - agent: "staffing_partner_human"
        condition: "calling_agent_response.requires_practice_lead_review == false and calling_agent_response.requires_engagement_lead_review == false and calling_agent_response.conflicts == []"

  # ─────────────────────────────────────────────────────────────────────────
  # talent_development_agent — Talent Development Lead (AI). One talent ROLE,
  # three responsibilities: idle detection, reskilling bets, 6-month career
  # paths. agency/talent_development_agent.py: @pre_compose pulls the idle
  # ledger; @chain OVERWRITES the idle lists from the store (the LLM can't
  # invent or drop idle staff) and FORCES the senior-flight-risk escalation.
  # ─────────────────────────────────────────────────────────────────────────
  talent_development_agent:
    name: "talent_development_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2500
    description: "Talent development lead — flags long-idle staff, recommends reskilling bets, drafts 6-month career paths."
    prompt: |
      You are the Talent Development Lead. context["prepared_data"] carries the
      data pulled for you (pre_compose):
        - "idle_ledger": {idle_2w, idle_4w, avg_idle_weeks} — the DETERMINISTIC
          idle ledger from the bench feed
        - "subject_consultant": the person a career path is for (if any)
        - "open_opportunities": pipeline projects for reskilling bets
      Load the `talent` playbook for how to build a retention-grade career path.

      1. IDLE DETECTION — echo the idle_ledger verbatim (idle_2w, idle_4w,
         avg_idle_weeks). NEVER invent idle staff; the post-processor re-asserts
         these from the store regardless.
      2. RESKILLING — for each idle person, recommend 1-3 skills to develop
         against pipeline demand, into "recommendations". When you draft a career
         path and "recommendations" would be empty, surface each skill bet as
         {person_id, skill, why_now, source: "career_path"}.
      3. CAREER PATHS — on a career-path request, fill "employee_id",
         "current_level" (one of junior|mid|senior|staff|partner; else "mid"),
         "target_role_6mo", "skill_bets" (3 max, each {skill, why_now}),
         "internal_projects" (each {project_id, title}), "certifications"
         (certification names), "retention_risk_score" (0..1), an
         "employee_facing_narrative" ("we see you", not "do this training"), and
         "confidence" (0..1). Quality floor: empty narrative or no internal
         projects → confidence must not exceed 0.4. When NO career path is
         requested, leave every career-path key at its empty default.
      4. RETENTION ESCALATION — set "requires_practice_lead_review" true exactly
         when retention_risk_score >= 0.7 AND current_level is senior|staff|
         partner; else false.
      IDENTITY — echo input plan_id verbatim into "plan_id" ("" when absent).

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"idle_2w": [], "idle_4w": [], "avg_idle_weeks": 0, "recommendations": [], "plan_id": "", "employee_id": "", "current_level": "", "target_role_6mo": "", "skill_bets": [], "internal_projects": [], "certifications": [], "retention_risk_score": 0, "employee_facing_narrative": "", "confidence": 0, "requires_practice_lead_review": false}
    enforce_yields: true
    enforce_yields_retry: 1
    playbook:
      - intent: talent
        description: "How to draft a retention-grade 6-month career path, not a training list."
        responsibility: |
          1. Lead with the person, not the curriculum — the narrative is the
             product; the training is the means to it.
          2. Anchor every skill bet to a REAL pipeline opportunity they could
             grow into; cite it. Cap at 3 bets, prioritised.
          3. Score retention risk honestly. Losing a senior/staff/partner at
             high risk is a practice-lead conversation, not an HR footnote.
          4. A path with no narrative or no internal project is weak — say so by
             capping confidence at 0.4 rather than dressing it up.
        variables: [employee_id]
    yields:
      idle_2w: { type: array, items: { type: object } }         # re-asserted from the store
      idle_4w: { type: array, items: { type: object } }         # re-asserted from the store
      avg_idle_weeks: "number"
      recommendations: { type: array, items: { type: object } }
      plan_id: "string"
      employee_id: "string"
      current_level: "string"
      target_role_6mo: "string"
      skill_bets: { type: array, items: { type: object } }
      internal_projects: { type: array, items: { type: object } }
      certifications: { type: array, items: string }
      retention_risk_score: "number"
      employee_facing_narrative: "string"
      confidence: "number"
      requires_practice_lead_review: "boolean"
    inputs:
      payload: "object"
      upstream_yields: "object"
      idle_staff: "object"
    can_call:
      # 4+ weeks idle OR a senior/staff/partner at high retention risk → practice
      # lead. The retention flag is a SEPARATE trigger from idle.
      - agent: "practice_lead_human"
        condition: "calling_agent_response.idle_4w != [] or calling_agent_response.requires_practice_lead_review == true"
      # 2+ weeks idle → reskilling recs to talent ops; career-path drafts land there too.
      - agent: "talent_ops_human"
        condition: "calling_agent_response.idle_2w != [] or calling_agent_response.recommendations != []"

  # ─────────────────────────────────────────────────────────────────────────
  # performance_review_agent — Performance-Review Writer (AI). Drafts the review
  # from feedback + utilisation + skill growth. The composite-score formula and
  # rating bands are needed EVERY turn, so they stay resident in the prompt (the
  # doctrine's "if forgetting it breaks the turn, it is prompt"). The signed
  # review of record lives in your HRIS; this only drafts.
  # ─────────────────────────────────────────────────────────────────────────
  performance_review_agent:
    name: "performance_review_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2500
    description: "Performance-review writer — drafts a review from engagement feedback + utilisation + skill growth, with composite score + rating."
    prompt: |
      Draft the performance review from engagement feedback + utilisation + skill
      growth. You only DRAFT — the manager edits and signs in the HRIS.

      ECHO / IDENTITY — copy verbatim from the input:
        - "resource_id": input resource_id ("" when absent — then set every
          numeric field to 0, every list empty, both requires_* flags false)
        - "period": input period ("Q1-2026" when absent)
        - "review_id": "review-" + resource_id + "-" + period
        - "plan_id": input plan_id ("" when absent)
        - "generated_at_utc": current UTC timestamp, ISO-8601

      EVIDENCE COUNTS from the input feeds:
        - "engagement_sample_size": count of engagement_feedback entries
        - "avg_client_feedback": mean of their scores (0..1), 2dp; 0 when none
        - "utilisation_pct": echo input utilisation_pct verbatim
        - "skill_growth_count": count of skill_growth entries
        - "peer_feedback_count": count of peer_feedback entries

      DRAFT:
        - "strengths": 3-5 documented strengths (each tied to an engagement / skill)
        - "development_areas": 2-3 specific growth themes (not generic)

      SCORING — "composite_score" EXACTLY as:
            0.40 × avg_client_feedback
          + 0.25 × min(1, utilisation_pct / 75)
          + 0.15 × min(1, skill_growth_count / 3)
          + 0.10 × min(1, count of strengths / 4)
          + 0.10 × (1 − min(1, count of development_areas / 5))
        clamped 0..1, 2dp.

      RATING — "overall_rating" from composite_score:
        ≥ 0.90 "exceptional" | ≥ 0.75 "exceeds" | ≥ 0.60 "meets" |
        ≥ 0.40 "below" | else "unsat".

      GATES:
        - "requires_calibration": true exactly when overall_rating is
          "exceptional" or "unsat" (both tails need the calibration committee).
        - "requires_manager_signoff": always true.
      Be balanced; cite specific engagements; NEVER reference protected attributes.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"review_id": "", "resource_id": "", "period": "", "composite_score": 0, "overall_rating": "", "strengths": [], "development_areas": [], "engagement_sample_size": 0, "avg_client_feedback": 0, "utilisation_pct": 0, "skill_growth_count": 0, "peer_feedback_count": 0, "requires_calibration": false, "requires_manager_signoff": false, "generated_at_utc": "", "plan_id": ""}
    enforce_yields: true
    yields:
      review_id: "string"
      resource_id: "string"
      period: "string"
      composite_score: "number"
      overall_rating: "string"
      strengths: { type: array, items: string }
      development_areas: { type: array, items: string }
      engagement_sample_size: "number"
      avg_client_feedback: "number"
      utilisation_pct: "number"
      skill_growth_count: "number"
      peer_feedback_count: "number"
      requires_calibration: "boolean"
      requires_manager_signoff: "boolean"
      generated_at_utc: "string"
      plan_id: "string"
    inputs:
      upstream_yields: "object"
      resource_id: "string"
      period: "string"
    can_call:
      # Exceptional / unsat ratings need the calibration committee.
      - agent: "practice_lead_human"
        condition: "calling_agent_response.requires_calibration == true"
      # Normal range → manager review + sign.
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_calibration == false"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # esat_survey_agent — Employee-Experience Analyst (AI + anonymity control).
  # ANONYMITY IS A STRUCTURAL CONTROL: the salted-hash ledger in
  # agency/esat_survey_agent.py mints the per-survey salt and hashes responder
  # ids so identities never enter mesh state. All analysis math is explicit in
  # the prompt (needed every turn).
  # ─────────────────────────────────────────────────────────────────────────
  esat_survey_agent:
    name: "esat_survey_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2000
    description: "Employee-experience analyst — launches anonymised pulse surveys and analyses closed ones (engagement index + themes + HRBP flags)."
    prompt: |
      You run anonymised ESAT pulse surveys. Set "action" to the mode you are
      executing ("pulse" or "analyse").

      MODE pulse — launching a survey:
        - Echo "cohort" from input ("bench" when absent) and "cohort_size".
        - If cohort_size is 0 or missing → "action": "skipped", everything else
          at its empty default.
        - "questions": the five standard pulse questions as [key, text] pairs:
            ["engagement", "I look forward to work most days"],
            ["recognition", "I feel recognised for my contributions"],
            ["growth", "I'm growing in my role"],
            ["manager", "My manager supports my work effectively"],
            ["nps_proxy", "I would recommend our firm as a place to work"]
        - Leave "survey_id" and "launched_at_utc" "" — the anonymisation ledger
          mints them after you respond; the per-survey salt never passes through you.

      MODE analyse — given a closed survey's anonymised responses (responder ids
      are salted hashes; you NEVER see names):
        - Echo "survey_id", "cohort", "cohort_size" from input.
        - "response_count": distinct responder hashes.
        - "response_rate": response_count / cohort_size (0 when 0), 3dp.
        - "avg_scores": per-question mean, 2dp.
        - "engagement_index": (mean of avg_scores − 1) / 4, 2dp.
        - "themes": [{theme, frequency_pct, sentiment, sample_quote}] — anonymise;
          never quote a name or identifier.
        - "open_text_count": count of open-text responses.
        - "requires_hrbp_review": true when ANY of: engagement_index < 0.55, OR
          any question average < 2.5/5, OR response_rate < 0.40, OR a manager /
          compensation theme surfaces at high frequency.
      Surface uncomfortable themes when real; don't soften.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "survey_id": "", "cohort": "", "cohort_size": 0, "questions": [], "launched_at_utc": "", "response_count": 0, "response_rate": 0, "avg_scores": {}, "engagement_index": 0, "themes": [], "open_text_count": 0, "requires_hrbp_review": false}
    enforce_yields: true
    yields:
      action: "string"
      survey_id: "string"
      cohort: "string"
      cohort_size: "number"
      questions: { type: array, items: { type: array, items: string } }   # [key, text] pairs
      launched_at_utc: "string"
      response_count: "number"
      response_rate: "number"
      avg_scores: "object"
      engagement_index: "number"
      themes:
        type: array
        items:
          type: object
          fields: { theme: string, frequency_pct: number, sentiment: string, sample_quote: string }
      open_text_count: "number"
      requires_hrbp_review: "boolean"
    inputs:
      mode: "string"
      survey_id: "string"
      cohort: "string"
      cohort_size: "number"
    can_call:
      - agent: "talent_ops_human"
        condition: "calling_agent_response.requires_hrbp_review == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # weekly_bench_sweep_agent — Bench-Report Runner (SYSTEM). Every Monday at
  # 08:00 (before the 09:00 bench review) it builds the weekly bench report:
  # bench %, below-floor consultants, idle ledger, open demand, and one action
  # item per problem. Day 0 agency/weekly_bench_sweep_agent.py renders it from
  # the dev store to ./out/bench_report_<ISO week>.md (re-running in the same
  # week rewrites the same file). Reachable on demand via the
  # weekly_bench_report entry point. The report is recorded in the WORM audit.
  # To have YOUR PSA / BI tool (Power BI, Looker, Tableau…) produce it instead:
  # create the vault connection 'bench_report_n8n' (same shape as psa_n8n),
  # then uncomment the two n8n lines; the Python shapes the workflow's
  # {report_url, action_items}. To post the finished report to a channel or
  # BI inbox: add a webhook named 'bench_report_post' on Tools → Webhooks
  # (it picks an Outbound webhook record), then uncomment `notify`. The post
  # is fire-and-forget; nothing reads its reply.
  # ─────────────────────────────────────────────────────────────────────────
  weekly_bench_sweep_agent:
    name: "weekly_bench_sweep_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Bench-report runner — builds the Monday bench report (dev store day 0; your PSA/BI via n8n when wired) and returns the link + action items."
    # integration: "n8n"
    # connector_config: {connection: bench_report_n8n, timeout: 60}
    # notify: {webhook: bench_report_post, when: done}
    wake_up: "0 8 * * 1"             # Monday 08:00 ...
    timezone: "Asia/Kolkata"         # ... in the firm's timezone, NOT UTC
    wake_up_input:
      trigger: weekly_bench_report
    yields:
      report_url: "string"
      action_items: "list"
      week: "string"
      source: "string"               # dev_store | bench_report_n8n
    inputs:
      trigger: "string"
    can_call:
      # The weekly report is a fact worth a WORM entry.
      - agent: "bench_audit_logger_agent"
        condition: "always"

  # ─────────────────────────────────────────────────────────────────────────
  # allocation_booker_agent — Allocation Booker (programmatic FINISHER). The
  # actuator BEHIND the human approval step. It never approves — it re-checks
  # that a human actually approved (allow-token allowlist + block-token denylist,
  # UNKNOWN verdict fails closed), refuses to double-book (the store's write-time
  # floor), RENDERS the booking confirmation artifact to ./out, DELETES the
  # partial on a blocked floor, and records the assignment. Dev path books in the
  # store day-0 (a real, verifiable record — never a faked ack).
  # See agency/allocation_booker_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  allocation_booker_agent:
    name: "allocation_booker_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Allocation booker (finisher) — re-checks the approval, refuses to double-book, renders the booking artifact, records it."
    # n8n workflow → your PSA booking write. Day 0 the Python books in the dev
    # store. To wire it: create the vault connection 'psa_booking_n8n' (same
    # shape as psa_n8n above), then uncomment the two lines below (before the
    # first start; after it, in Studio). A failed PSA call books nothing.
    # integration: "n8n"
    # connector_config: {connection: psa_booking_n8n, timeout: 60}
    yields:
      plan_id: "string"
      booked: "list"
      assignment_ids: "list"
      booked_count: "number"
      rejected: "list"
      booking_ok: "boolean"
      booking_summary: "string"
      artifact_path: "string"
      status: "string"          # booked | blocked
      block_reasons: "list"
    inputs:
      plan_id: "string"
      assignments: "list"
      matches: "list"
      upstream_yields: "object"
    can_call:
      - agent: "bench_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, reached in their own inbox. Nothing is booked
  # on silence. If nobody answers within a seat's human_timeout_seconds, the
  # request waits no longer: its Inbox card closes and the ticket records that
  # no reply came. Nobody is chased automatically. fallback_on_timeout /
  # fallback_response (held_for_review -> audit) are kept as the declared
  # intent; on leafmesh 2.4.486 a dual seat's timeout routes nothing. `dual`
  # belongs on the human/boundary agent ONLY; these humans call CHAIN /
  # PROGRAMMATIC / EXECUTE agents, never another dual agent (dual→dual is an
  # unbounded ping-pong the SDK warns on). There is no human→human wire.
  # ─────────────────────────────────────────────────────────────────────────

  staffing_partner_human:
    name: "staffing_partner_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400   # 4h to decide a clean plan
    description: "Staffing partner — owns assignment decisions on clean plans."
    # operator_ids: ["you@yourcompany.com"]   # unset → SHARED inbox. Only set
    #   real operator emails; a placeholder assigns to a nonexistent operator.
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    human_prompt_template: |
      A staffing plan (or a below-floor utilisation alert) needs your call.
      For a plan: reply "approved" to have the assignments booked, "rejected"
      to stop it, or "hold". Only "approved" books anything; every other reply
      (and any reply to an alert, e.g. "noted") is recorded in the audit log.
    yields:
      human_message: "string"       # approved | rejected | hold | held_for_review
    inputs:
      plan_id: "object"
    can_call:
      # APPROVE → the booker BOOKS the assignment (the finisher finishes the job).
      - agent: "allocation_booker_agent"
        condition: "calling_agent_response.human_message == 'approved'"
      # Anything else (rejected / hold / noted / the held_for_review fallback)
      # is recorded in the audit log.
      - agent: "bench_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approved'"

  engagement_lead_human:
    name: "engagement_lead_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400
    description: "Engagement lead — resolves assignment conflicts / double-bookings."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    human_prompt_template: |
      A staffing plan has a conflict (someone is matched to two engagements) or
      a draft performance review needs your sign-off.
      For a plan: reply "approved" to book it, "rejected" to stop it, or "hold".
      On approval the booker books in plan order and refuses any slice that
      would take a consultant past 100%, so a double-booked person is booked
      once and the rest is listed as rejected.
      For a review: reply "signed" or "changes" (recorded in the audit log).
      Only "approved" books anything; every other reply is recorded.
    yields:
      human_message: "string"
    inputs:
      plan_id: "object"
    can_call:
      # APPROVE (conflict resolved) → the booker books the assignment.
      - agent: "allocation_booker_agent"
        condition: "calling_agent_response.human_message == 'approved'"
      - agent: "bench_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approved'"

  talent_ops_human:
    name: "talent_ops_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 21600   # 6h
    description: "Talent ops / HRBP — owns reskilling + training pathways and HRBP review of survey signals."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"
    inputs:
      plan_id: "object"
    can_call:
      # Advisory role — every outcome (approved, held on silence) is recorded.
      - agent: "bench_audit_logger_agent"
        condition: "always"

  practice_lead_human:
    name: "practice_lead_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 28800   # 8h
    description: "Practice lead — bench % authority, structural-gap calls, retention escalation, calibration."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"
    inputs:
      plan_id: "object"
    can_call:
      - agent: "bench_audit_logger_agent"
        condition: "always"

  # ─────────────────────────────────────────────────────────────────────────
  # bench_audit_logger_agent — WORM audit sink. Hash-chained, append-only, the
  # terminus of every path (a booking, a held gate, a practice-lead call).
  # Registered in main.py via sdk.intelligence("bench_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  bench_audit_logger_agent:
    name: "bench_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "WORM audit — hash-chains every booking, decision, and held gate. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/bench_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
