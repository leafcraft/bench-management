  # ────────────────────────────────────────────────────────────
  # performance_review_agent — Q/annual review drafting. Pure YAML:
  # the composite-score formula and rating bands are explicit
  # instructions below. The signed review of record lives in YOUR
  # HRIS — this agent only drafts; the WORM audit sink records the
  # decision trail.
  # ────────────────────────────────────────────────────────────
  performance_review_agent:
    name: "performance_review_agent"
    agent_type: "llm"
    description: "Drafts performance review from engagement feedback + utilisation + skill growth"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2500
    communication_type: "chain"

    prompt: |
      Draft the performance review from engagement feedback +
      utilisation + skill growth. You only DRAFT — the manager edits
      and signs in the HRIS.

      ECHO / IDENTITY — copy verbatim from the input:
        - "resource_id": input resource_id ("" when absent — then set
          every numeric field to 0, every list empty, and both
          requires_* flags false)
        - "period": input period (use "Q1-2026" when absent)
        - "review_id": "review-" + resource_id + "-" + period
        - "plan_id": input plan_id ("" when absent)
        - "generated_at_utc": current UTC timestamp, ISO-8601

      EVIDENCE COUNTS — computed from the input feeds:
        - "engagement_sample_size": number of engagement_feedback entries
        - "avg_client_feedback": mean of their score values (0..1),
          2 decimals; 0 when there is no feedback
        - "utilisation_pct": echo the input utilisation_pct verbatim
        - "skill_growth_count": number of skill_growth entries
        - "peer_feedback_count": number of peer_feedback entries

      DRAFT:
        - "strengths": list of 3-5 documented strengths (each tied to
            a specific engagement or skill growth)
        - "development_areas": list of 2-3 specific growth themes
            (NOT generic — tie to specific situations)

      SCORING — compute "composite_score" EXACTLY as:
            0.40 × avg_client_feedback
          + 0.25 × min(1, utilisation_pct / 75)
          + 0.15 × min(1, skill_growth_count / 3)
          + 0.10 × min(1, count of strengths / 4)
          + 0.10 × (1 − min(1, count of development_areas / 5))
        clamped into 0..1, rounded to 2 decimals.

      RATING — map "overall_rating" from composite_score:
        ≥ 0.90 "exceptional" | ≥ 0.75 "exceeds" | ≥ 0.60 "meets" |
        ≥ 0.40 "below" | otherwise "unsat".

      GATES:
        - "requires_calibration": true exactly when overall_rating is
          "exceptional" or "unsat" — both tails need the calibration
          committee.
        - "requires_manager_signoff": always true.

      Be balanced — exceptional reviews and unsat reviews both need
      human calibration. Cite specific engagements / projects.
      NEVER reference protected attributes.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"review_id": "", "resource_id": "", "period": "", "composite_score": 0, "overall_rating": "", "strengths": [], "development_areas": [], "engagement_sample_size": 0, "avg_client_feedback": 0, "utilisation_pct": 0, "skill_growth_count": 0, "peer_feedback_count": 0, "requires_calibration": false, "requires_manager_signoff": false, "generated_at_utc": "", "plan_id": ""}

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "review_rubric"

    yields:
      review_id: "string"
      resource_id: "string"
      period: "string"
      composite_score: "number"
      overall_rating: "string"
      strengths: "list"
      development_areas: "list"
      engagement_sample_size: "number"
      avg_client_feedback: "number"
      utilisation_pct: "number"
      skill_growth_count: "number"
      peer_feedback_count: "number"
      requires_calibration: "boolean"
      requires_manager_signoff: "boolean"
      generated_at_utc: "string"
      # Identity passthrough — practice/engagement-lead inboxes declare plan_id
      plan_id: "string"

    inputs:
      upstream_yields: "object"
      resource_id: "string"
      period: "string"

    can_call:
      # Exceptional / unsat ratings need calibration committee
      - agent: "practice_lead_human"
        condition: "calling_agent_response.requires_calibration == true"

      # Normal range → manager review + sign
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_calibration == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # esat_survey_agent — anonymised pulse surveys + trend analysis.
  # ANONYMITY IS A CONTROL: the salted-hash anonymisation ledger
  # stays in agency/esat_survey_agent.py (the ONLY remaining Python
  # post-processor in this template) — it mints the per-survey salt
  # and hashes responder ids so identities never enter mesh state.
  # All analysis math is explicit in the prompt below.
  # ────────────────────────────────────────────────────────────
  esat_survey_agent:
    name: "esat_survey_agent"
    agent_type: "llm"
    description: "Pulse-survey scheduler + anonymised response analyser; engagement index + theme extraction"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2000
    communication_type: "chain"

    prompt: |
      You run anonymised ESAT pulse surveys. Set "action" to the
      mode you are executing ("pulse" or "analyse").

      MODE pulse — launching a survey:
        - Echo "cohort" from the input (use "bench" when absent) and
          "cohort_size" from the input.
        - If cohort_size is 0 or missing, set "action": "skipped"
          and leave everything else at its empty default.
        - "questions": the five standard pulse questions as
          [key, text] pairs:
            ["engagement", "I look forward to work most days"],
            ["recognition", "I feel recognised for my contributions"],
            ["growth", "I'm growing in my role"],
            ["manager", "My manager supports my work effectively"],
            ["nps_proxy", "I would recommend our firm as a place to work"]
        - Leave "survey_id" and "launched_at_utc" as "" — the
          anonymisation ledger mints them after you respond; the
          per-survey salt never passes through you.

      MODE analyse — given a closed survey's anonymised responses
      (responder ids are salted hashes; you NEVER see names):
        - Echo "survey_id", "cohort" and "cohort_size" from the input.
        - "response_count": number of DISTINCT responder hashes.
        - "response_rate": response_count / cohort_size (0 when
          cohort_size is 0), 3 decimals.
        - "avg_scores": per-question mean score, 2 decimals each.
        - "engagement_index": (mean of the avg_scores values − 1) / 4,
          2 decimals — the 0..1 composite over the 5-point scale.
        - "themes": list of {theme, frequency_pct, sentiment,
          sample_quote} from the open text. Anonymise — never quote
          a name or specific identifier.
        - "open_text_count": number of open-text responses.
        - "requires_hrbp_review": true exactly when ANY of:
            engagement_index < 0.55 (absolute floor), OR
            any question's average score < 2.5 out of 5, OR
            response_rate < 0.40 (ghost rate), OR
            "themes" surfaces a manager issue or compensation gap at
            high frequency (a hot theme above the numeric floor is
            still worth a human look).

      Surface uncomfortable themes when they're real (manager issues,
      compensation gaps). Don't soften.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"action": "", "survey_id": "", "cohort": "", "cohort_size": 0, "questions": [], "launched_at_utc": "", "response_count": 0, "response_rate": 0, "avg_scores": {}, "engagement_index": 0, "themes": [], "open_text_count": 0, "requires_hrbp_review": false}

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "esat_taxonomy"

    yields:
      action: "string"
      survey_id: "string"
      cohort: "string"
      cohort_size: "number"
      questions: "list"
      launched_at_utc: "string"
      response_count: "number"
      response_rate: "number"
      avg_scores: "object"
      engagement_index: "number"
      themes: "list"
      open_text_count: "number"
      requires_hrbp_review: "boolean"

    inputs:
      mode: "string"
      survey_id: "string"
      cohort: "string"
      cohort_size: "number"

    can_call:
      # requires_hrbp_review now folds in the hot-theme judgment (see
      # the prompt's fourth OR clause) — one enforced wire, no soft
      # narration route that the can_call can't back.
      - agent: "talent_ops_human"
        condition: "calling_agent_response.requires_hrbp_review == true"

    auto_store_response: true
    auto_store_yields: true
